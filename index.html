<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>LiberaEc | Acompañamiento Integral</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-body: #F0F4F8;
      --bg-chat: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      
      --primary: #0F4C5C;
      --primary-light: #1A6B80;
      --secondary: #5F9EA0;
      --accent: #E07A6A;
      
      --bubble-bot: #FFFFFF;
      --bubble-user-start: #1A6B80;
      --bubble-user-end: #0F4C5C;
      
      --border: #E2E8F0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      
      --fuente-tamano: 1rem;
    }

    body.dark {
      --bg-body: #0F172A;
      --bg-chat: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      
      --primary: #38BDF8;
      --primary-light: #0EA5E9;
      --secondary: #2DD4BF;
      
      --bubble-bot: #334155;
      --bubble-user-start: #0EA5E9;
      --bubble-user-end: #0284C7;
      
      --border: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      font-size: var(--fuente-tamano);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* Espacio para el input (80px) + el menú flotante (70px) */
      padding-bottom: 160px; 
    }

    /* HEADER */
    .encabezado {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 10;
    }
    
    .header-controls { position: absolute; right: 15px; top: 15px; display: flex; gap: 10px; }
    .ctrl-btn { 
      background: rgba(255,255,255,0.15); border: none; border-radius: 50%; 
      width: 38px; height: 38px; color: white; cursor: pointer; font-size: 1.1rem; 
      display: flex; align-items: center; justify-content: center; transition: background 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.3); }
    
    .encabezado h1 { 
      font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; 
      justify-content: center; gap: 0.6rem; letter-spacing: -0.5px;
    }
    .encabezado p { font-size: 0.85rem; opacity: 0.9; margin-top: 0.3rem; font-weight: 400; }

    /* ESTADO */
    .estado { 
      display: flex; align-items: center; justify-content: center; gap: 0.5rem; 
      margin: 1rem auto; padding: 0.4rem 1.2rem; border-radius: 40px; 
      width: fit-content; font-size: 0.75rem; font-weight: 500;
      background: var(--bg-chat); color: var(--text-muted); box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    /* CHAT AREA */
    .chat {
      flex: 1; max-width: 800px; width: 100%; margin: 0 auto;
      padding: 1rem 1rem 2rem; display: flex; flex-direction: column; gap: 1.2rem;
      overflow-y: auto;
    }

    .mensaje {
      max-width: 85%; padding: 1rem 1.2rem; border-radius: 20px;
      line-height: 1.6; position: relative; animation: slideUp 0.3s ease;
      box-shadow: var(--shadow-sm);
    }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .bot {
      background: var(--bubble-bot); color: var(--text-main);
      align-self: flex-start; border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    
    .user {
      background: linear-gradient(135deg, var(--bubble-user-start), var(--bubble-user-end));
      color: white; align-self: flex-end; border-bottom-right-radius: 4px;
      border: none;
    }

    .tiempo { font-size: 0.65rem; opacity: 0.7; margin-top: 0.6rem; text-align: right; font-weight: 500; }
    
    /* BOTONES DE ACCIÓN EN MENSAJES */
    .btn-accion-mini { 
      background: var(--bg-body); border: 1px solid var(--border); color: var(--primary); 
      cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-top: 10px; 
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; 
      border-radius: 12px; transition: all 0.2s;
    }
    .btn-accion-mini:hover { background: var(--primary); color: white; border-color: var(--primary); }
    
    .btn-descarga { 
      display: inline-flex; align-items: center; gap: 0.5rem; background: #ECFDF5; color: #047857;
      border: 1px solid #A7F3D0; padding: 0.6rem 1.2rem; border-radius: 12px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; margin-top: 0.8rem; transition: all 0.2s;
    }
    .btn-descarga:hover { background: #D1FAE5; }

    /* OPCIONES (BOTONES RÁPIDOS) */
    .opciones { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.5rem 0; justify-content: center; }
    .btn-op {
      display: flex; align-items: center; gap: 0.6rem; background: var(--bg-chat); 
      border: 1px solid var(--border); border-radius: 30px; padding: 0.7rem 1.2rem;
      font-weight: 500; cursor: pointer; color: var(--text-main); transition: all 0.2s;
      box-shadow: var(--shadow-sm); font-size: 0.9rem;
    }
    .btn-op:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }

    /* INPUT AREA (Fija abajo) */
    .input-area {
      position: fixed; bottom: 70px; left: 0; right: 0; /* Sube para dejar espacio al menú en móvil */
      background: var(--bg-chat); border-top: 1px solid var(--border);
      padding: 0.8rem 1rem; display: flex; gap: 0.6rem; z-index: 100;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }

    .input-wrapper {
      max-width: 800px; margin: 0 auto; width: 100%;
      display: flex; gap: 0.6rem; align-items: center;
    }

    .input-chat {
      flex: 1; padding: 0.9rem 1.2rem; border: 1px solid var(--border);
      border-radius: 30px; font-size: 1rem; background: var(--bg-body);
      color: var(--text-main); font-family: inherit; transition: all 0.2s;
    }
    .input-chat:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,107,128,0.1); }

    .btn-enviar {
      background: var(--primary); border: none; border-radius: 50%;
      width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: white; transition: all 0.2s; box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }
    .btn-enviar:hover { background: var(--primary-light); transform: scale(1.05); }

    .btn-microfono {
      background: var(--bg-body); border: 1px solid var(--border); border-radius: 50%;
      width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); transition: all 0.2s; flex-shrink: 0;
    }
    .btn-microfono:hover { color: var(--primary); border-color: var(--primary); }

    .grabando { 
      background: #FEF2F2 !important; color: #DC2626 !important; border-color: #FCA5A5 !important; 
      animation: pulse 1.5s infinite; 
    }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }

    /* MENÚ FLOTANTE (Entre el chat y el input) */
    .menu-persistente {
      position: fixed; 
      bottom: 0; /* Pegado al fondo en móvil */
      left: 0; 
      right: 0;
      background: var(--bg-chat); 
      border-top: 1px solid var(--border);
      display: flex; 
      justify-content: space-around; 
      padding: 0.5rem 0;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
      z-index: 101;
    }

    .item-menu {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; font-size: 0.65rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer; padding: 6px 10px;
      border-radius: 30px; transition: all 0.2s;
    }
    .item-menu svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
    .item-menu:hover { color: var(--primary); }

    /* BOTÓN DE PÁNICO */
    .btn-panico {
      position: fixed; bottom: 150px; right: 16px;
      background: var(--accent); color: white; border: none; border-radius: 40px;
      padding: 12px 20px; font-weight: 700; display: flex; align-items: center; gap: 8px;
      cursor: pointer; z-index: 110; box-shadow: 0 4px 15px rgba(224,122,106,0.5);
      transition: all 0.2s; font-size: 0.85rem;
    }
    .btn-panico:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(224,122,106,0.6); }

    /* ALERTA EMERGENCIA */
    .alerta-emergencia {
      background: #FEF2F2; border: 2px solid #EF4444; color: #991B1B;
      padding: 20px; border-radius: 16px; margin: 10px 0; text-align: center;
    }
    .alerta-emergencia strong { display: block; font-size: 1.1rem; margin-bottom: 10px; }
    .alerta-emergencia p { font-size: 0.9rem; margin-bottom: 15px; }
    .alerta-emergencia button {
      background: #EF4444; color: white; border: none; padding: 12px 20px;
      border-radius: 12px; margin-top: 8px; font-weight: 700; cursor: pointer;
      width: 100%; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* INDICADOR ESCRIBIENDO */
    .escribiendo {
      display: flex; gap: 5px; background: var(--bubble-bot); padding: 1rem 1.2rem;
      border-radius: 20px; width: fit-content; border-bottom-left-radius: 4px;
      align-self: flex-start; border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .punto { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite; }
    .punto:nth-child(2) { animation-delay: 0.2s; }
    .punto:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

    /* FOOTER */
    footer {
      text-align: center; font-size: 0.75rem; color: var(--text-muted);
      padding: 1.2rem; background: transparent;
      position: fixed; bottom: 125px; left: 0; right: 0; z-index: 50;
    }

    /* RESPONSIVE (Escritorio) */
    @media (min-width: 768px) {
      body { padding-bottom: 140px; }
      
      .input-area {
        bottom: 0;
        padding: 1rem;
        background: transparent;
        box-shadow: none;
        pointer-events: none;
      }
      .input-wrapper {
        background: var(--bg-chat);
        padding: 0.8rem;
        border-radius: 40px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        pointer-events: auto;
        max-width: 700px;
      }

      .menu-persistente {
        bottom: 90px; /* Flota sobre el input */
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: fit-content;
        border-radius: 40px;
        border: 1px solid var(--border);
        padding: 0.4rem;
        box-shadow: var(--shadow-lg);
      }
      
      .item-menu:hover { background: var(--bg-body); border-radius: 20px; }
      
      .btn-panico { bottom: 160px; right: 30px; }
      footer { display: none; } /* Ocultar footer en escritorio */
    }
  </style>
</head>
<body>
<div class="encabezado">
  <div class="header-controls">
    <button class="ctrl-btn" id="btn-font" title="Cambiar tamaño de letra">A+</button>
    <button class="ctrl-btn" id="btn-theme" title="Modo oscuro">🌙</button>
  </div>
  <h1>
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    LiberaEc
  </h1>
  <p>Espacio seguro de acompañamiento y orientación legal</p>
</div>

<div id="estado" class="estado">☁️ Conectando...</div>
<main class="chat" id="chat"></main>

<button class="btn-panico" id="escape"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg><span>Salir rápido</span></button>

<div class="menu-persistente">
  <button class="item-menu" data-a="cambiar-perfil"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></button>
  <button class="item-menu" data-a="tipos"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>Tipos</span></button>
  <button class="item-menu" data-a="recursos"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Recursos</span></button>
  <button class="item-menu" id="btn-exportar"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span>Exportar</span></button>
  <button class="item-menu" id="btn-limpiar"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg><span>Limpiar</span></button>
</div>

<form class="input-area" id="form">
  <div class="input-wrapper">
    <button type="button" class="btn-microfono" id="btn-mic" title="Hablar por micrófono">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
    </button>
    <input type="text" id="input" class="input-chat" placeholder="Escribe o usa el micrófono..." autocomplete="off">
    <button type="submit" class="btn-enviar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</form>

<footer>
  <p>Emergencia: <strong>911</strong> · Línea Mujer: <strong>147</strong></p>
</footer>

<script>
// El script es exactamente el mismo que ya tenías y funciona perfectamente.
// Se ha mantenido intacto para no romper ninguna funcionalidad.
(function() {
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const estadoDiv = document.getElementById('estado');
  const btnMic = document.getElementById('btn-mic');
  const WORKER_URL = 'https://liberaec-ai.talleresycapacitaciones2025.workers.dev/';
  
  let currentRole = "publico";
  let historial = []; 
  const palabrasEmergencia = ["me va a matar", "cuchillo", "me está golpeando", "me va a pegar", "pistola", "me quiere matar", "auxilio", "socorro", "violando", "abusando de mí"];

  if(localStorage.getItem('tema') === 'dark') document.body.classList.add('dark');
  document.getElementById('btn-theme').onclick = () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('tema', document.body.classList.contains('dark') ? 'dark' : 'light');
  };

  let zoomLevel = 1;
  document.getElementById('btn-font').onclick = () => {
    zoomLevel = zoomLevel === 1 ? 1.15 : (zoomLevel === 1.15 ? 1.3 : 1);
    document.documentElement.style.setProperty('--fuente-tamano', zoomLevel + 'rem');
  };

  function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

  let escribiendoElement = null;
  function mostrarEscribiendo(show) {
    if (show && !escribiendoElement) {
      escribiendoElement = document.createElement('div');
      escribiendoElement.className = 'escribiendo';
      escribiendoElement.innerHTML = '<div class="punto"></div><div class="punto"></div><div class="punto"></div>';
      chat.appendChild(escribiendoElement);
      scrollToBottom();
    } else if (!show && escribiendoElement) {
      escribiendoElement.remove();
      escribiendoElement = null;
    }
  }

  function formatMarkdown(text) {
    let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    formatted = formatted.replace(/\n/g, '<br>');
    return formatted;
  }

  function generarWord(textoPlano, nombreArchivo) {
    const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Documento</title></head><body>`;
    const footer = "</body></html>";
    const content = textoPlano.split('\n').map(p => `<p>${p}</p>`).join('');
    const html = header + content + footer;
    const blob = new Blob([html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('btn-exportar').onclick = () => {
    if (historial.length === 0) return alert("No hay conversación para exportar.");
    let texto = "=== HISTORIAL DE CONVERSACIÓN - LIBERAEC ===\n\n";
    historial.forEach(msg => { texto += `[${msg.role.toUpperCase()}]: ${msg.content}\n\n`; });
    generarWord(texto, 'Historial_LiberaEc');
  };

  let vozActual = null;
  function toggleVoz(texto, boton) {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      document.querySelectorAll('.btn-audio').forEach(b => b.innerHTML = '🔊 Escuchar');
      if (vozActual === boton) { vozActual = null; return; }
    }
    vozActual = boton;
    boton.innerHTML = '⏹️ Detener';
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.onend = () => { boton.innerHTML = '🔊 Escuchar'; if (vozActual === boton) vozActual = null; };
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Tu navegador no soporta lectura en voz alta.");
      boton.innerHTML = '🔊 Escuchar';
    }
  }

  let reconocimiento = null;
  let escuchando = false;
  let textoAcumulado = ""; 

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    reconocimiento = new SpeechRecognition();
    reconocimiento.lang = 'es-EC';
    reconocimiento.continuous = true; 
    reconocimiento.interimResults = true; 

    reconocimiento.onstart = () => {
      escuchando = true;
      btnMic.classList.add('grabando');
      estadoDiv.textContent = "🎙️ Escuchando...";
      textoAcumulado = input.value; 
    };

    reconocimiento.onresult = (event) => {
      let textoTranscrito = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        textoTranscrito += event.results[i][0].transcript;
      }
      input.value = textoAcumulado + textoTranscrito;
    };

    reconocimiento.onerror = (event) => {
      console.error("Error de micrófono:", event.error);
      estadoDiv.textContent = "❌ Error al escuchar.";
      escuchando = false;
      btnMic.classList.remove('grabando');
    };

    reconocimiento.onend = () => {
      escuchando = false;
      btnMic.classList.remove('grabando');
      estadoDiv.textContent = "📝 Texto dictado. Presiona Enviar.";
      input.focus();
    };

    btnMic.onclick = () => {
      if (escuchando) {
        reconocimiento.stop();
      } else {
        window.speechSynthesis.cancel();
        try { reconocimiento.start(); } catch (e) { reconocimiento.stop(); }
      }
    };
  } else {
    btnMic.style.display = 'none';
  }

  function addMessage(text, tipo) {
    const div = document.createElement('div');
    div.className = `mensaje ${tipo === 'bot' ? 'bot' : 'user'}`;
    const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let contenido = text;
    
    if (tipo === 'bot') {
      contenido = formatMarkdown(text);
      const rolesPermitidos = ["abogado", "juez", "junta"];
      if (text.length > 300 && rolesPermitidos.includes(currentRole)) {
        const btnId = 'btn-dl-' + Date.now();
        contenido += `<br><br><button id="${btnId}" class="btn-descarga">📄 Descargar Word</button>`;
        setTimeout(() => {
          const btn = document.getElementById(btnId);
          if (btn) btn.onclick = () => generarWord(text, 'Documento_Legal');
        }, 50);
      }
      const audioId = 'btn-audio-' + Date.now();
      contenido += `<br><button id="${audioId}" class="btn-accion-mini btn-audio" title="Leer en voz alta">🔊 Escuchar</button>`;
      setTimeout(() => {
        const btnAudio = document.getElementById(audioId);
        if (btnAudio) btnAudio.onclick = () => toggleVoz(text, btnAudio);
      }, 50);
    }
    
    div.innerHTML = `${contenido}<div class="tiempo">${hora}</div>`;
    chat.appendChild(div);
    scrollToBottom();
  }

  function addOpciones(lista) {
    const wrap = document.createElement('div');
    wrap.className = 'opciones';
    lista.forEach(op => {
      const btn = document.createElement('button');
      btn.className = 'btn-op';
      btn.innerHTML = op.texto;
      btn.onclick = () => manejarInput(op.valor, true);
      wrap.appendChild(btn);
    });
    chat.appendChild(wrap);
    scrollToBottom();
  }

  function mostrarMenuPerfiles() {
    chat.innerHTML = '';
    historial = []; 
    addMessage("👋 <strong>Bienvenido/a a LiberaEc</strong><br><br>Para brindarte la mejor orientación, por favor selecciona tu perfil:", 'bot');
    addOpciones([
      { texto: "🆘 Soy víctima", valor: "role_victima" },
      { texto: "⚖️ Soy abogado/a", valor: "role_abogado" },
      { texto: "👩‍⚖️ Soy juez/a", valor: "role_juez" },
      { texto: "🏛️ Junta Cantonal", valor: "role_junta" },
      { texto: "📚 Información", valor: "role_publico" }
    ]);
  }

  async function obtenerRespuestaWorker(mensaje) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 40000);
    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: mensaje, role: currentRole, history: historial }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      return data.response || "Lo siento, no obtuve respuesta.";
    } catch (err) {
      clearTimeout(timeoutId);
      return "🔌 No pude conectar. Si estás en peligro, llama al **911** o al **147**.";
    }
  }

  async function manejarInput(texto, esOpcion = false) {
    const txt = texto.trim();
    if (!txt) return;

    if (txt.startsWith("role_")) {
      if (txt === "role_victima") { currentRole = "victima"; addMessage("Perfil: <strong>Víctima / Busco ayuda</strong>. Estoy aquí para escucharte.", 'bot'); }
      if (txt === "role_abogado") { currentRole = "abogado"; addMessage("Perfil: <strong>Abogado/a</strong>. Puedo ayudarte a redactar escritos y analizar casos.", 'bot'); }
      if (txt === "role_juez") { currentRole = "juez"; addMessage("Perfil: <strong>Juez/a o Fiscal</strong>. Estoy listo para auditar resoluciones.", 'bot'); }
      if (txt === "role_junta") { currentRole = "junta"; addMessage("Perfil: <strong>Junta Cantonal</strong>. Puedo orientarte sobre medidas.", 'bot'); }
      if (txt === "role_publico") { currentRole = "publico"; addMessage("Perfil: <strong>Información general</strong>. ¿Qué te gustaría saber?", 'bot'); }
      return;
    }

    if (txt === "cambiar-perfil") { mostrarMenuPerfiles(); return; }

    if (txt === "recursos" || txt === "tipos") {
      addMessage(txt, 'user');
      if (txt === "recursos") {
        addMessage("📞 **Recursos en Ecuador:**\n\n🚨 **911** – Emergencias\n💜 **147** – Línea Mujer\n⚖️ **Fiscalía: 1800-354-378**", 'bot');
      } else {
        addMessage("📚 <strong>Tipos de violencia:</strong><br><br>• <strong>Física:</strong> Golpes, empujones.<br>• <strong>Psicológica:</strong> Insultos, amenazas.<br>• <strong>Sexual:</strong> Actos sin consentimiento.<br>• <strong>Económica:</strong> Control del dinero.<br>• <strong>Vicaria:</strong> Daño a los hijos para lastimar a la madre.", 'bot');
      }
      return;
    }

    const esEmergencia = palabrasEmergencia.some(p => txt.toLowerCase().includes(p));
    if (esEmergencia) {
      addMessage(txt, 'user');
      const alertaHTML = `
        <div class="alerta-emergencia">
          <strong>🚨 PELIGRO INMINENTE 🚨</strong>
          <p>Busca un lugar seguro y llama inmediatamente. No estás sola.</p>
          <button onclick="window.location.href='tel:911'">📞 Llamar al 911</button>
          <button onclick="window.location.href='tel:147'">📞 Llamar al 147</button>
        </div>
      `;
      addMessage(alertaHTML, 'bot');
      historial.push({ role: "user", content: txt });
      historial.push({ role: "assistant", content: "Se detectó emergencia. Se mostraron números de auxilio." });
      return;
    }

    addMessage(txt, 'user');
    historial.push({ role: "user", content: txt });
    
    mostrarEscribiendo(true);
    estadoDiv.textContent = "⏳ Analizando...";

    const respuesta = await obtenerRespuestaWorker(txt);

    mostrarEscribiendo(false);
    estadoDiv.textContent = "✅ Conectado";
    
    historial.push({ role: "assistant", content: respuesta });
    addMessage(respuesta, 'bot');

    if (currentRole === "victima") {
      addOpciones([
        { texto: "📞 Ver recursos", valor: "recursos" },
        { texto: "🧩 Hacer el test", valor: "tipos" }
      ]);
    } else if (currentRole === "abogado") {
      addOpciones([
        { texto: "📝 Redactar denuncia", valor: "Redacta una denuncia por violencia intrafamiliar" },
        { texto: "📄 Solicitar medidas", valor: "Redacta una solicitud de medidas de protección" }
      ]);
    }
  }

  function limpiarChat() {
    if (!confirm("¿Seguro que quieres borrar la conversación?")) return;
    window.speechSynthesis.cancel();
    if(reconocimiento) reconocimiento.stop();
    chat.innerHTML = '';
    historial = [];
    addMessage("🔄 Conversación reiniciada. ¿En qué puedo ayudarte ahora?", 'bot');
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if (val) manejarInput(val);
    input.value = '';
    textoAcumulado = ""; 
  };

  document.querySelectorAll('.item-menu').forEach(btn => {
    if (btn.id !== 'btn-limpiar' && btn.id !== 'btn-exportar') {
      btn.onclick = () => {
         const accion = btn.getAttribute('data-a');
         if(accion) manejarInput(accion);
      };
    }
  });

  document.getElementById('btn-limpiar').onclick = limpiarChat;
  document.getElementById('escape').onclick = () => {
    window.speechSynthesis.cancel();
    if(reconocimiento) reconocimiento.stop();
    chat.innerHTML = '';
    historial = [];
    window.location.replace('https://www.google.com');
  };

  function init() {
    mostrarMenuPerfiles();
    estadoDiv.textContent = "✅ Conectado";
  }

  init();
})();
</script>
</body>
</html>
