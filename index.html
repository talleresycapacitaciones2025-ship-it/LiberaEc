<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>LiberaEc | Herramienta Integral</title>
  <style>
    :root {
      --fondo: #F5F7F8; --card: #E1E6E8; --texto: #2B3940; --primario: #2E5564;
      --acento: #8AA29E; --calma: #4B6B7A; --alerta: #E07A6A; --borde: #C9D0D2;
      --fuente-tamano: 1rem;
    }
    body.dark {
      --fondo: #121826; --card: #1F2937; --texto: #F3F4F6; --primario: #4B6B7A;
      --borde: #374151;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--fondo); color: var(--texto);
      padding-bottom: 70px; transition: background 0.3s, color 0.3s; font-size: var(--fuente-tamano);
    }
    .encabezado {
      background: linear-gradient(135deg, var(--calma), var(--primario)); color: white;
      padding: 1.2rem; text-align: center; border-radius: 0 0 24px 24px; position: relative;
    }
    .header-controls { position: absolute; right: 15px; top: 15px; display: flex; gap: 10px; }
    .ctrl-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 35px; height: 35px; color: white; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
    .encabezado h1 { font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .encabezado p { font-size: 0.85rem; opacity: 0.9; margin-top: 0.2rem; }
    .estado { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 0.8rem auto; padding: 0.3rem 1rem; border-radius: 40px; width: fit-content; font-size: 0.7rem; background: var(--card); color: var(--texto); }
    .chat { max-width: 700px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; overflow-y: auto; max-height: calc(100vh - 200px); }
    .mensaje { max-width: 85%; padding: 0.9rem 1.1rem; border-radius: 18px; white-space: pre-wrap; line-height: 1.5; position: relative; }
    .bot { background: var(--card); border-left: 4px solid var(--calma); align-self: flex-start; }
    .user { background: var(--primario); color: white; align-self: flex-end; border-radius: 18px 18px 4px 18px; }
    .tiempo { font-size: 0.65rem; opacity: 0.7; margin-top: 0.5rem; text-align: right; }
    .btn-accion-mini { background: none; border: none; color: var(--calma); cursor: pointer; font-size: 0.85rem; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 12px; background: rgba(75,107,122,0.1); }
    .btn-accion-mini:hover { background: rgba(75,107,122,0.2); }
    
    .opciones { display: flex; flex-direction: column; gap: 0.5rem; margin: 0.5rem 0; }
    .btn-op { display: flex; align-items: center; gap: 0.8rem; background: var(--card); border: 1px solid var(--borde); border-radius: 60px; padding: 0.75rem 1.2rem; font-weight: 500; cursor: pointer; color: var(--texto); transition: all 0.2s; text-align: left; }
    .btn-op:hover { background: var(--borde); }
    .btn-descarga { display: inline-flex; align-items: center; gap: 0.5rem; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-top: 0.8rem; transition: all 0.2s; }
    
    .input-area { max-width: 700px; margin: 0 auto 1rem; padding: 0 1rem; display: flex; gap: 0.4rem; position: sticky; bottom: 70px; background: var(--fondo); }
    .input-chat { flex: 1; padding: 0.85rem 1.2rem; border: 1px solid var(--borde); border-radius: 60px; font-size: 1rem; background: var(--card); color: var(--texto); font-family: inherit; }
    .btn-enviar { background: var(--primario); border: none; border-radius: 60px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
    .btn-microfono { background: var(--card); border: 1px solid var(--borde); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--texto); transition: all 0.2s; }
    
    /* Animación del micrófono cuando está escuchando */
    .grabando { background: #ffebee !important; color: #d32f2f !important; border-color: #ef9a9a !important; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(211, 47, 47, 0); } 100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); } }

    .menu-persistente { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 0.5rem 0.2rem; border-top: 1px solid var(--borde); z-index: 100; overflow-x: auto; }
    .item-menu { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; font-size: 0.65rem; font-weight: 500; color: var(--texto); cursor: pointer; padding: 6px 10px; border-radius: 40px; min-width: 60px; }
    .item-menu svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
    
    .btn-panico { position: fixed; bottom: 80px; right: 16px; background: var(--alerta); color: white; border: none; border-radius: 50px; padding: 12px 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer; z-index: 200; box-shadow: 0 4px 12px rgba(224,122,106,0.4); }
    .alerta-emergencia { background: #ffebee; border: 2px solid #f44336; color: #b71c1c; padding: 15px; border-radius: 12px; margin: 10px 0; text-align: center; font-weight: bold; }
    .alerta-emergencia button { background: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-top: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 5px; }

    .escribiendo { display: flex; gap: 6px; background: var(--card); padding: 0.6rem 1rem; border-radius: 30px; width: fit-content; border-left: 3px solid var(--calma); align-self: flex-start; }
    .punto { width: 8px; height: 8px; background: var(--calma); border-radius: 50%; animation: rebote 1.4s infinite; }
    @keyframes rebote { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    footer { text-align: center; font-size: 0.7rem; color: #6c757d; padding: 1rem; background: var(--card); }
  </style>
</head>
<body>
<div class="encabezado">
  <div class="header-controls">
    <button class="ctrl-btn" id="btn-font" title="Cambiar tamaño de letra">A+</button>
    <button class="ctrl-btn" id="btn-theme" title="Modo oscuro">🌙</button>
  </div>
  <h1><svg width="28" viewBox="0 0 24 24" fill="none" stroke="white"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> LiberaEc</h1>
  <p>Herramienta integral de acompañamiento y análisis legal</p>
</div>
<div id="estado" class="estado">☁️ Conectando...</div>
<main class="chat" id="chat"></main>
<form class="input-area" id="form">
  <button type="button" class="btn-microfono" id="btn-mic" title="Hablar por micrófono">
    <svg width="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
  </button>
  <input type="text" id="input" class="input-chat" placeholder="Escribe o usa el micrófono..." autocomplete="off">
  <button type="submit" class="btn-enviar"><svg width="20" viewBox="0 0 24 24" fill="none" stroke="white"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</form>
<div class="menu-persistente">
  <button class="item-menu" data-a="cambiar-perfil"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></button>
  <button class="item-menu" data-a="tipos"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span>Tipos</span></button>
  <button class="item-menu" data-a="recursos"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Recursos</span></button>
  <button class="item-menu" id="btn-exportar"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span>Exportar</span></button>
  <button class="item-menu" id="btn-limpiar"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg><span>Limpiar</span></button>
</div>
<button class="btn-panico" id="escape"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="white"><path d="M18 6L6 18M6 6l12 12"/></svg><span>Salir rápido</span></button>
<footer><p>Emergencia: <strong>911</strong> · Línea Mujer <strong>147</strong></p></footer>

<script>
(function() {
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const estadoDiv = document.getElementById('estado');
  const btnMic = document.getElementById('btn-mic');
  const WORKER_URL = 'https://liberaec-ai.talleresycapacitaciones2025.workers.dev/';
  
  let currentRole = "publico";
  let historial = []; 
  const palabrasEmergencia = ["me va a matar", "cuchillo", "me está golpeando", "me va a pegar", "pistola", "me quiere matar", "auxilio", "socorro", "violando", "abusando de mí"];

  // ========== CONFIGURACIÓN INICIAL Y PREFERENCIAS ==========
  if(localStorage.getItem('tema') === 'dark') document.body.classList.add('dark');
  document.getElementById('btn-theme').onclick = () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('tema', document.body.classList.contains('dark') ? 'dark' : 'light');
  };

  let zoomLevel = 1;
  document.getElementById('btn-font').onclick = () => {
    zoomLevel = zoomLevel === 1 ? 1.2 : (zoomLevel === 1.2 ? 1.4 : 1);
    document.documentElement.style.setProperty('--fuente-tamano', zoomLevel + 'rem');
  };

  function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

  let escribiendoElement = null;
  function mostrarEscribiendo(show) {
    if (show && !escribiendoElement) {
      escribiendoElement = document.createElement('div');
      escribiendoElement.className = 'escribiendo';
      escribiendoElement.innerHTML = '<div class="punto"></div><div class="punto"></div><div class="punto"></div>';
      chat.appendChild(escribiendoElement);
      scrollToBottom();
    } else if (!show && escribiendoElement) {
      escribiendoElement.remove();
      escribiendoElement = null;
    }
  }

  function formatMarkdown(text) {
    let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    formatted = formatted.replace(/\n/g, '<br>');
    return formatted;
  }

  function generarWord(textoPlano, nombreArchivo) {
    const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Documento</title></head><body>`;
    const footer = "</body></html>";
    const content = textoPlano.split('\n').map(p => `<p>${p}</p>`).join('');
    const html = header + content + footer;
    const blob = new Blob([html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('btn-exportar').onclick = () => {
    if (historial.length === 0) return alert("No hay conversación para exportar.");
    let texto = "=== HISTORIAL DE CONVERSACIÓN - LIBERAEC ===\n\n";
    historial.forEach(msg => { texto += `[${msg.role.toUpperCase()}]: ${msg.content}\n\n`; });
    generarWord(texto, 'Historial_LiberaEc');
  };

  // ========== LECTURA EN VOZ ALTA CON BOTÓN DE DETENER ==========
  let vozActual = null;
  function toggleVoz(texto, boton) {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      document.querySelectorAll('.btn-audio').forEach(b => b.innerHTML = '🔊 Escuchar');
      if (vozActual === boton) { vozActual = null; return; }
    }
    vozActual = boton;
    boton.innerHTML = '⏹️ Detener';
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.onend = () => { boton.innerHTML = '🔊 Escuchar'; if (vozActual === boton) vozActual = null; };
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Tu navegador no soporta lectura en voz alta.");
      boton.innerHTML = '🔊 Escuchar';
    }
  }

  // ========== DICTADO POR VOZ (RECONOCIMIENTO DE HABLA) ==========
  let reconocimiento = null;
  let escuchando = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    reconocimiento = new SpeechRecognition();
    reconocimiento.lang = 'es-EC'; // Español de Ecuador
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;

    reconocimiento.onstart = () => {
      escuchando = true;
      btnMic.classList.add('grabando');
      estadoDiv.textContent = "🎙️ Escuchando...";
    };

    reconocimiento.onresult = (event) => {
      const texto = event.results[0][0].transcript;
      input.value = texto;
      // Enviar automáticamente después de dictar
      setTimeout(() => {
        if (input.value.trim() !== "") manejarInput(input.value.trim());
        input.value = '';
      }, 500);
    };

    reconocimiento.onerror = (event) => {
      console.error("Error de micrófono:", event.error);
      estadoDiv.textContent = "❌ Error al escuchar. Intenta de nuevo.";
      escuchando = false;
      btnMic.classList.remove('grabando');
    };

    reconocimiento.onend = () => {
      escuchando = false;
      btnMic.classList.remove('grabando');
      estadoDiv.textContent = "✅ Conectado";
    };

    btnMic.onclick = () => {
      if (escuchando) {
        reconocimiento.stop();
      } else {
        // Detener cualquier voz que esté hablando antes de escuchar
        window.speechSynthesis.cancel();
        try {
          reconocimiento.start();
        } catch (e) {
          reconocimiento.stop(); // Si hay un error de doble inicio, forzar detención
        }
      }
    };
  } else {
    // Si el navegador no soporta dictado, ocultamos el botón
    btnMic.style.display = 'none';
    console.warn("Este navegador no soporta el reconocimiento de voz.");
  }

  // ========== MANEJO DE MENSAJES EN EL DOM ==========
  function addMessage(text, tipo) {
    const div = document.createElement('div');
    div.className = `mensaje ${tipo === 'bot' ? 'bot' : 'user'}`;
    const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let contenido = text;
    
    if (tipo === 'bot') {
      contenido = formatMarkdown(text);
      const rolesPermitidos = ["abogado", "juez", "junta"];
      if (text.length > 300 && rolesPermitidos.includes(currentRole)) {
        const btnId = 'btn-dl-' + Date.now();
        contenido += `<br><br><button id="${btnId}" class="btn-descarga">📄 Descargar en Word</button>`;
        setTimeout(() => {
          const btn = document.getElementById(btnId);
          if (btn) btn.onclick = () => generarWord(text, 'Documento_Legal');
        }, 50);
      }
      const audioId = 'btn-audio-' + Date.now();
      contenido += `<br><button id="${audioId}" class="btn-accion-mini btn-audio" title="Leer en voz alta">🔊 Escuchar</button>`;
      setTimeout(() => {
        const btnAudio = document.getElementById(audioId);
        if (btnAudio) btnAudio.onclick = () => toggleVoz(text, btnAudio);
      }, 50);
    }
    
    div.innerHTML = `${contenido}<div class="tiempo">${hora}</div>`;
    chat.appendChild(div);
    scrollToBottom();
  }

  function addOpciones(lista) {
    const wrap = document.createElement('div');
    wrap.className = 'opciones';
    lista.forEach(op => {
      const btn = document.createElement('button');
      btn.className = 'btn-op';
      btn.innerHTML = op.texto;
      btn.onclick = () => manejarInput(op.valor, true);
      wrap.appendChild(btn);
    });
    chat.appendChild(wrap);
    scrollToBottom();
  }

  function mostrarMenuPerfiles() {
    chat.innerHTML = '';
    historial = []; 
    addMessage("👋 <strong>Bienvenido/a a LiberaEc</strong><br><br>Para brindarte la mejor orientación, por favor selecciona tu perfil:", 'bot');
    addOpciones([
      { texto: "🆘 Soy víctima / Busco ayuda", valor: "role_victima" },
      { texto: "⚖️ Soy abogado/a", valor: "role_abogado" },
      { texto: "👩‍⚖️ Soy juez/a o fiscal", valor: "role_juez" },
      { texto: "🏛️ Junta Cantonal / Operador", valor: "role_junta" },
      { texto: "📚 Solo busco información", valor: "role_publico" }
    ]);
  }

  async function obtenerRespuestaWorker(mensaje) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 40000);
    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: mensaje, role: currentRole, history: historial }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      return data.response || "Lo siento, no obtuve respuesta.";
    } catch (err) {
      clearTimeout(timeoutId);
      console.error('Error en Worker:', err);
      return "🔌 No pude conectar en este momento. Si estás en peligro, llama al **911** o al **147**.";
    }
  }

  async function manejarInput(texto, esOpcion = false) {
    const txt = texto.trim();
    if (!txt) return;

    if (txt.startsWith("role_")) {
      if (txt === "role_victima") { currentRole = "victima"; addMessage("Has seleccionado: <strong>Víctima / Busco ayuda</strong>. Estoy aquí para escucharte y orientarte.", 'bot'); }
      if (txt === "role_abogado") { currentRole = "abogado"; addMessage("Has seleccionado: <strong>Abogado/a</strong>. Puedo ayudarte a redactar escritos y analizar casos.", 'bot'); }
      if (txt === "role_juez") { currentRole = "juez"; addMessage("Has seleccionado: <strong>Juez/a o Fiscal</strong>. Estoy listo para auditar resoluciones.", 'bot'); }
      if (txt === "role_junta") { currentRole = "junta"; addMessage("Has seleccionado: <strong>Junta Cantonal</strong>. Puedo orientarte sobre medidas y protección.", 'bot'); }
      if (txt === "role_publico") { currentRole = "publico"; addMessage("Has seleccionado: <strong>Información general</strong>. ¿Qué te gustaría saber?", 'bot'); }
      return;
    }

    if (txt === "cambiar-perfil") { mostrarMenuPerfiles(); return; }

    if (txt === "recursos" || txt === "tipos") {
      addMessage(txt, 'user');
      if (txt === "recursos") {
        addMessage("📞 **Recursos en Ecuador:**\n\n🚨 **911** – Emergencias\n💜 **147** – Línea Mujer\n⚖️ **Fiscalía: 1800-354-378**\n\nLlama al **147** para orientación según tu ubicación.", 'bot');
      } else {
        addMessage("📚 <strong>Tipos de violencia:</strong><br><br>• <strong>Física:</strong> Golpes, empujones.<br>• <strong>Psicológica:</strong> Insultos, amenazas, control.<br>• <strong>Sexual:</strong> Actos sin consentimiento.<br>• <strong>Económica:</strong> Control del dinero.<br>• <strong>Vicaria:</strong> Daño a los hijos para lastimar a la madre.<br>• <strong>Simbólica:</strong> Patrones que reproducen desigualdad.", 'bot');
      }
      return;
    }

    const esEmergencia = palabrasEmergencia.some(p => txt.toLowerCase().includes(p));
    if (esEmergencia) {
      addMessage(txt, 'user');
      const alertaHTML = `
        <div class="alerta-emergencia">
          🚨 <strong>PARECE UNA SITUACIÓN DE PELIGRO INMINENTE</strong> 🚨<br><br>
          Por favor, busca un lugar seguro y llama inmediatamente a los números de emergencia. No estás sola.
          <br><br>
          <button onclick="window.location.href='tel:911'">📞 Llamar al 911 (Emergencias)</button>
          <button onclick="window.location.href='tel:147'">📞 Llamar al 147 (Línea Mujer)</button>
        </div>
      `;
      addMessage(alertaHTML, 'bot');
      historial.push({ role: "user", content: txt });
      historial.push({ role: "assistant", content: "Se detectó emergencia. Se mostraron números de auxilio." });
      return;
    }

    addMessage(txt, 'user');
    historial.push({ role: "user", content: txt });
    
    mostrarEscribiendo(true);
    estadoDiv.textContent = "⏳ Analizando...";

    const respuesta = await obtenerRespuestaWorker(txt);

    mostrarEscribiendo(false);
    estadoDiv.textContent = "✅ Conectado";
    
    historial.push({ role: "assistant", content: respuesta });
    addMessage(respuesta, 'bot');

    if (currentRole === "victima") {
      addOpciones([
        { texto: "📞 Ver recursos", valor: "recursos" },
        { texto: "🧩 Hacer el test", valor: "tipos" }
      ]);
    } else if (currentRole === "abogado") {
      addOpciones([
        { texto: "📝 Redactar una denuncia", valor: "Redacta una denuncia por violencia intrafamiliar" },
        { texto: "📄 Solicitar medidas", valor: "Redacta una solicitud de medidas de protección" }
      ]);
    }
  }

  function limpiarChat() {
    if (!confirm("¿Seguro que quieres borrar la conversación? Esta acción no se puede deshacer.")) return;
    window.speechSynthesis.cancel();
    chat.innerHTML = '';
    historial = [];
    addMessage("🔄 Conversación reiniciada. ¿En qué puedo ayudarte ahora?", 'bot');
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if (val) manejarInput(val);
    input.value = '';
  };

  document.querySelectorAll('.item-menu').forEach(btn => {
    if (btn.id !== 'btn-limpiar' && btn.id !== 'btn-exportar') {
      btn.onclick = () => {
         const accion = btn.getAttribute('data-a');
         if(accion) manejarInput(accion);
      };
    }
  });

  document.getElementById('btn-limpiar').onclick = limpiarChat;
  document.getElementById('escape').onclick = () => {
    window.speechSynthesis.cancel();
    if(reconocimiento) reconocimiento.stop();
    chat.innerHTML = '';
    historial = [];
    window.location.replace('https://www.google.com');
  };

  function init() {
    mostrarMenuPerfiles();
    estadoDiv.textContent = "✅ Conectado";
  }

  init();
})();
</script>
</body>
</html>
