<!DOCTYPE html>
<html lang="es-EC">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>LiberaEc | Acompañamiento seguro</title>
  <style>
    /* (Mismo CSS que antes, sin cambios) */
    :root {
      --fondo: #F5F7F8;
      --card: #E1E6E8;
      --texto: #2B3940;
      --primario: #2E5564;
      --acento: #8AA29E;
      --calma: #4B6B7A;
      --alerta: #E07A6A;
      --borde: #C9D0D2;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      padding-bottom: 70px;
    }
    .encabezado {
      background: linear-gradient(135deg, var(--calma), var(--primario));
      color: white;
      padding: 1.2rem;
      text-align: center;
      border-radius: 0 0 24px 24px;
    }
    .encabezado h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .encabezado p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 0.2rem;
    }
    .estado {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.8rem auto;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      width: fit-content;
      font-size: 0.7rem;
      background: var(--card);
      color: var(--texto);
    }
    .chat {
      max-width: 700px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }
    .mensaje {
      max-width: 85%;
      padding: 0.9rem 1.1rem;
      border-radius: 18px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .bot {
      background: white;
      border-left: 4px solid var(--calma);
      align-self: flex-start;
    }
    .user {
      background: var(--primario);
      color: white;
      align-self: flex-end;
      border-radius: 18px 18px 4px 18px;
    }
    .tiempo {
      font-size: 0.65rem;
      opacity: 0.7;
      margin-top: 0.5rem;
      text-align: right;
    }
    .opciones {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }
    .btn-op {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: white;
      border: 1px solid var(--borde);
      border-radius: 60px;
      padding: 0.75rem 1.2rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--texto);
      transition: all 0.2s;
    }
    .btn-op:hover {
      background: var(--card);
      border-color: var(--calma);
    }
    .input-area {
      max-width: 700px;
      margin: 0 auto 1rem;
      padding: 0 1rem;
      display: flex;
      gap: 0.6rem;
      position: sticky;
      bottom: 70px;
      background: var(--fondo);
    }
    .input-chat {
      flex: 1;
      padding: 0.85rem 1.2rem;
      border: 1px solid var(--borde);
      border-radius: 60px;
      font-size: 1rem;
      background: white;
      font-family: inherit;
    }
    .input-chat:focus {
      outline: none;
      border-color: var(--calma);
    }
    .btn-enviar {
      background: var(--primario);
      border: none;
      border-radius: 60px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }
    .btn-enviar:hover {
      background: var(--calma);
    }
    .menu-persistente {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0.8rem;
      border-top: 1px solid var(--borde);
      z-index: 100;
    }
    .item-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--texto);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 40px;
      transition: all 0.2s;
    }
    .item-menu svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
    }
    .item-menu:hover {
      color: var(--calma);
      background: var(--card);
    }
    .btn-escape {
      position: fixed;
      bottom: 80px;
      right: 16px;
      background: var(--alerta);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 200;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-escape:hover {
      background: #c0392b;
      transform: scale(1.02);
    }
    .escribiendo {
      display: flex;
      gap: 6px;
      background: white;
      padding: 0.6rem 1rem;
      border-radius: 30px;
      width: fit-content;
      border-left: 3px solid var(--calma);
      align-self: flex-start;
    }
    .punto {
      width: 8px;
      height: 8px;
      background: var(--calma);
      border-radius: 50%;
      animation: rebote 1.4s infinite;
    }
    @keyframes rebote {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    footer {
      text-align: center;
      font-size: 0.7rem;
      color: #6c757d;
      padding: 1rem;
      background: white;
    }
  </style>
</head>
<body>
<div class="encabezado">
  <h1>
    <svg width="28" viewBox="0 0 24 24" fill="none" stroke="white">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    LiberaEc
  </h1>
  <p>Acompañamiento tranquilo, confidencial y seguro · Ecuador</p>
</div>
<div id="estado" class="estado">☁️ Conectando...</div>
<main class="chat" id="chat"></main>
<form class="input-area" id="form">
  <input type="text" id="input" class="input-chat" placeholder="Escribe aquí, con confianza..." autocomplete="off">
  <button type="submit" class="btn-enviar">
    <svg width="20" viewBox="0 0 24 24" fill="none" stroke="white">
      <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
    </svg>
  </button>
</form>
<div class="menu-persistente">
  <button class="item-menu" data-a="tipos">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span>Tipos</span>
  </button>
  <button class="item-menu" data-a="recursos">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Recursos</span>
  </button>
  <button class="item-menu" data-a="test">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2"/><path d="M9 12h6M9 16h6"/></svg>
    <span>Test</span>
  </button>
  <button class="item-menu" data-a="privacidad">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>Privacidad</span>
  </button>
  <button class="item-menu" data-a="salir">
    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    <span>Salir</span>
  </button>
</div>
<button class="btn-escape" id="escape">
  <svg width="18" viewBox="0 0 24 24" fill="none" stroke="white"><path d="M18 6L6 18M6 6l12 12"/></svg>
  <span>Salir rápido</span>
</button>
<footer>
  <p>Emergencia: <strong>911</strong> · Línea Mujer <strong>147</strong> · Información confidencial</p>
</footer>

<script>
(function() {
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const estadoDiv = document.getElementById('estado');

  let testActivo = false;
  let testRespuestas = [];
  let testIndice = 0;

  const preguntasTest = [
    { q: "🧩 <strong>Pregunta 1/6</strong><br><br>¿Tu pareja o familiar <strong>controla tus horarios, redes sociales o dinero</strong>?", opciones: ["Sí", "No", "No estoy segura"] },
    { q: "🧩 <strong>Pregunta 2/6</strong><br><br>¿<strong>Recibes insultos, humillaciones o amenazas</strong>?", opciones: ["Sí", "No", "No estoy segura"] },
    { q: "🧩 <strong>Pregunta 3/6</strong><br><br>¿Te <strong>alejan de amistades o familiares</strong>?", opciones: ["Sí", "No", "No estoy segura"] },
    { q: "🧩 <strong>Pregunta 4/6</strong><br><br>¿Has recibido <strong>empujones, golpes o algún daño físico</strong>?", opciones: ["Sí", "No", "No estoy segura"] },
    { q: "🧩 <strong>Pregunta 5/6</strong><br><br>¿Te <strong>obligan a hacer algo que no quieres</strong> (sexual o económicamente)?", opciones: ["Sí", "No", "No estoy segura"] },
    { q: "🧩 <strong>Pregunta 6/6</strong><br><br>¿<strong>Sientes miedo constante o ansiedad</strong> cuando estás con esa persona?", opciones: ["Sí", "No", "No estoy segura"] }
  ];

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  let escribiendoElement = null;

  function mostrarEscribiendo(show) {
    if (show && !escribiendoElement) {
      escribiendoElement = document.createElement('div');
      escribiendoElement.className = 'escribiendo';
      escribiendoElement.innerHTML = '<div class="punto"></div><div class="punto"></div><div class="punto"></div>';
      chat.appendChild(escribiendoElement);
      scrollToBottom();
    } else if (!show && escribiendoElement) {
      escribiendoElement.remove();
      escribiendoElement = null;
    }
  }

  // Función modificada para convertir **texto** en negritas
  function addMessage(text, tipo) {
    const div = document.createElement('div');
    div.className = `mensaje ${tipo === 'bot' ? 'bot' : 'user'}`;
    const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let contenido = text;
    if (tipo === 'bot') {
      // Convertir **texto** a <strong>texto</strong>
      contenido = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }
    div.innerHTML = `${contenido}<div class="tiempo">${hora}</div>`;
    chat.appendChild(div);
    scrollToBottom();
  }

  function addOpciones(lista) {
    const wrap = document.createElement('div');
    wrap.className = 'opciones';
    lista.forEach(op => {
      const btn = document.createElement('button');
      btn.className = 'btn-op';
      btn.innerHTML = `📌 ${op.texto}`;
      btn.onclick = () => manejarInput(op.valor, true);
      wrap.appendChild(btn);
    });
    chat.appendChild(wrap);
    scrollToBottom();
  }

  function mostrarPreguntaTest() {
    if (testIndice >= preguntasTest.length) {
      const totalSi = testRespuestas.filter(r => r === "Sí").length;
      let resultado = "";
      if (totalSi === 0) resultado = "✅ <strong>No se identificaron señales de violencia.</strong> Recuerda que siempre puedes buscar apoyo si algo te preocupa.";
      else if (totalSi <= 2) resultado = "⚠️ <strong>Hay algunas señales de alerta.</strong> Te recomendamos hablar con alguien de confianza o llamar al <strong>147</strong> para orientación.";
      else resultado = "🆘 <strong>Has identificado varias señales de violencia.</strong> No estás sola. Llama al <strong>147</strong> (Ministerio de la Mujer) para recibir ayuda profesional gratuita.";
      addMessage(`📋 <strong>Resultado del test</strong><br><br>${resultado}<br><br>💜 Recuerda: <strong>la violencia nunca es tu culpa.</strong>`, 'bot');
      addOpciones([
        { texto: "📞 Ver recursos de ayuda", valor: "recursos" },
        { texto: "📚 Tipos de violencia", valor: "tipos" }
      ]);
      testActivo = false;
      testRespuestas = [];
      testIndice = 0;
      return;
    }
    const pregunta = preguntasTest[testIndice];
    addMessage(pregunta.q, 'bot');
    const opcionesBotones = pregunta.opciones.map(opt => ({ texto: opt, valor: opt }));
    addOpciones(opcionesBotones);
  }

  // === Conexión al Worker de Cloudflare (con modelo ya corregido) ===
  async function obtenerRespuestaWorker(mensaje) {
    const url = 'https://liberaec-ai.talleresycapacitaciones2025.workers.dev/chat';
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 20000);
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: mensaje }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      return data.response || "Lo siento, no obtuve respuesta.";
    } catch (err) {
      clearTimeout(timeoutId);
      console.error('Error en Worker:', err);
      return "🔌 No se pudo conectar al servidor. Intenta de nuevo o llama al **147**.";
    }
  }

  async function manejarInput(texto, esOpcion = false) {
    const txt = texto.trim();
    if (!txt) return;

    if (testActivo && (txt === "Sí" || txt === "No" || txt === "No estoy segura")) {
      addMessage(txt, 'user');
      testRespuestas.push(txt);
      testIndice++;
      mostrarPreguntaTest();
      return;
    }

    if (txt.toLowerCase() === "test") {
      addMessage(txt, 'user');
      testActivo = true;
      testRespuestas = [];
      testIndice = 0;
      mostrarPreguntaTest();
      return;
    }

    addMessage(txt, 'user');
    mostrarEscribiendo(true);
    estadoDiv.textContent = "⏳ Consultando con Groq...";

    const respuesta = await obtenerRespuestaWorker(txt);

    mostrarEscribiendo(false);
    estadoDiv.textContent = "✅ Conectado";
    addMessage(respuesta, 'bot');
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if (val) manejarInput(val);
    input.value = '';
  };

  document.querySelectorAll('.item-menu').forEach(btn => {
    btn.onclick = () => manejarInput(btn.getAttribute('data-a'));
  });

  document.getElementById('escape').onclick = () => {
    document.body.style.opacity = '0.8';
    setTimeout(() => location.href = 'https://www.google.com', 150);
  };

  function init() {
    addMessage("👋 <strong>Hola, soy LiberaEc</strong><br><br>Estoy aquí para escucharte. Puedes contarme qué está pasando o usar el menú de abajo.<br><br>🔒 Tus conversaciones son confidenciales.", 'bot');
    addOpciones([
      { texto: "📚 Tipos de violencia", valor: "tipos" },
      { texto: "📞 Recursos Ecuador", valor: "recursos" },
      { texto: "🔒 Privacidad", valor: "privacidad" },
      { texto: "🧩 Test interactivo", valor: "test" }
    ]);
    estadoDiv.textContent = "✅ Conectado";
  }

  init();
})();
</script>
</body>
</html>
